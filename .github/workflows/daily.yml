name: Pistas

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Cada día a las 08:00 UTC comprueba cuántos días de pistas quedan.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ahead: ${{ steps.check.outputs.ahead }}
      last: ${{ steps.check.outputs.last }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Sin dependencias: los scripts solo usan la librería estándar de Node.
      - id: check
        run: npm run check

  remind:
    # Avisa con un issue cuando quedan menos de 7 días de pistas. Solo en el repo original.
    needs: check
    if: github.repository == 'vlunaklick/enredo' && github.event_name != 'pull_request' && fromJSON(needs.check.outputs.ahead) < 7
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AHEAD: ${{ needs.check.outputs.ahead }}
      LAST: ${{ needs.check.outputs.last }}
    steps:
      - run: |
          title="Quedan pocas pistas"
          body="Hay pistas hasta el **${LAST}** (${AHEAD} días por delante). Añade una tanda nueva: ver \`AGENTS.md\`."
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
